<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>VividTints — Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #1b1b22;
    color: #e8e8ec;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #9a9aa5; font-size: 0.85rem; margin-bottom: 20px; }
  #login-box {
    max-width: 320px;
    margin: 80px auto;
    background: #24242e;
    padding: 24px;
    border-radius: 10px;
    border: 1px solid #34343f;
  }
  #login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #3a3a46;
    background: #1b1b22;
    color: #e8e8ec;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
  }
  .btn-primary { background: #6c5ce7; color: white; }
  .btn-primary:hover { background: #5a4bd1; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-danger:hover { background: #c0392b; }
  .btn-ghost { background: #34343f; color: #e8e8ec; }
  .btn-ghost:hover { background: #40404d; }
  #app { display: none; max-width: 900px; margin: 0 auto; }
  #status { min-height: 20px; margin-bottom: 12px; font-size: 0.9rem; }
  #status[data-state="error"] { color: #ff7675; }
  #status[data-state="ok"] { color: #55efc4; }
  #status[data-state="pending"] { color: #9a9aa5; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #2e2e38; font-size: 0.88rem; vertical-align: top; }
  th { color: #9a9aa5; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:hover td { background: #22222b; }
  .desc { white-space: pre-line; color: #b8b8c2; font-size: 0.8rem; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .edit-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .edit-form input { padding: 6px; border-radius: 5px; border: 1px solid #3a3a46; background: #1b1b22; color: #e8e8ec; }
  #refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #empty-msg { color: #9a9aa5; padding: 20px 0; }
</style>
</head>
<body>

<div id="login-box">
  <h1>VividTints Admin</h1>
  <div class="sub">Enter admin key to manage bookings.</div>
  <input type="password" id="admin-key-input" placeholder="Admin key" autocomplete="off" />
  <button class="btn-primary" id="login-btn" style="width:100%">Unlock</button>
  <div id="login-status" style="margin-top:10px; font-size:0.85rem; color:#ff7675;"></div>
</div>

<div id="app">
  <h1>Bookings</h1>
  <div class="sub">Next 120 days. Only visible with the admin key.</div>
  <div id="refresh-bar">
    <button class="btn-ghost" id="refresh-btn">Refresh</button>
    <button class="btn-ghost" id="lock-btn">Lock</button>
  </div>
  <div id="status"></div>
  <table id="bookings-table">
    <thead>
      <tr>
        <th>When</th>
        <th>Booking</th>
        <th>Details</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookings-body"></tbody>
  </table>
  <div id="empty-msg" style="display:none;">No upcoming bookings.</div>
</div>

<script>
(function () {
  "use strict";

  var ENDPOINT = "https://script.google.com/macros/s/AKfycbzOKfhOsh8c7P_x21M0F6-eEXE_Rmt2lX2oXR_StaYyvPWElu30CW0-ML_w4NEsuqzeQQ/exec";
  var STORAGE_KEY = "vt-admin-key";

  var loginBox = document.getElementById("login-box");
  var app = document.getElementById("app");
  var keyInput = document.getElementById("admin-key-input");
  var loginBtn = document.getElementById("login-btn");
  var loginStatus = document.getElementById("login-status");
  var statusEl = document.getElementById("status");
  var body = document.getElementById("bookings-body");
  var emptyMsg = document.getElementById("empty-msg");
  var refreshBtn = document.getElementById("refresh-btn");
  var lockBtn = document.getElementById("lock-btn");

  function setStatus(state, msg) {
    statusEl.textContent = msg || "";
    statusEl.setAttribute("data-state", state || "");
  }

  function getKey() {
    return sessionStorage.getItem(STORAGE_KEY);
  }

  function showApp() {
    loginBox.style.display = "none";
    app.style.display = "block";
    loadBookings();
  }

  function showLogin(message) {
    sessionStorage.removeItem(STORAGE_KEY);
    app.style.display = "none";
    loginBox.style.display = "block";
    loginStatus.textContent = message || "";
  }

  function fmtWhen(iso) {
    var d = new Date(iso);
    return d.toLocaleString("en-US", {
      weekday: "short", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    });
  }

  function toDateInputValue(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function toTimeInputValue(iso) {
    var d = new Date(iso);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function loadBookings() {
    setStatus("pending", "Loading bookings…");
    body.innerHTML = "";
    emptyMsg.style.display = "none";

    var url = ENDPOINT + "?action=adminList&key=" + encodeURIComponent(getKey());
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.ok) {
          if (json.error === "Unauthorized") {
            showLogin("Wrong admin key.");
            return;
          }
          setStatus("error", json.error || "Failed to load bookings.");
          return;
        }
        setStatus("", "");
        renderBookings(json.bookings || []);
      })
      .catch(function () {
        setStatus("error", "Couldn't reach the booking system.");
      });
  }

  function renderBookings(bookings) {
    body.innerHTML = "";
    if (!bookings.length) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    bookings.sort(function (a, b) { return new Date(a.start) - new Date(b.start); });

    bookings.forEach(function (bk) {
      var tr = document.createElement("tr");
      tr.dataset.id = bk.id;

      var whenTd = document.createElement("td");
      whenTd.textContent = fmtWhen(bk.start);

      var titleTd = document.createElement("td");
      titleTd.textContent = bk.title;

      var descTd = document.createElement("td");
      descTd.className = "desc";
      descTd.textContent = bk.description || "";

      var actionsTd = document.createElement("td");
      var actionsWrap = document.createElement("div");
      actionsWrap.className = "row-actions";

      var editBtn = document.createElement("button");
      editBtn.className = "btn-ghost";
      editBtn.textContent = "Move";

      var cancelBtn = document.createElement("button");
      cancelBtn.className = "btn-danger";
      cancelBtn.textContent = "Cancel";

      actionsWrap.appendChild(editBtn);
      actionsWrap.appendChild(cancelBtn);
      actionsTd.appendChild(actionsWrap);

      tr.appendChild(whenTd);
      tr.appendChild(titleTd);
      tr.appendChild(descTd);
      tr.appendChild(actionsTd);
      body.appendChild(tr);

      editBtn.addEventListener("click", function () {
        openEditRow(tr, bk, actionsTd, actionsWrap);
      });

      cancelBtn.addEventListener("click", function () {
        if (!confirm("Cancel this booking?\n\n" + bk.title + "\n" + fmtWhen(bk.start))) return;
        deleteBooking(bk.id);
      });
    });
  }

  function openEditRow(tr, bk, actionsTd, actionsWrap) {
    actionsWrap.style.display = "none";

    var form = document.createElement("div");
    form.className = "edit-form";

    var dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.value = toDateInputValue(bk.start);

    var timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.value = toTimeInputValue(bk.start);

    var saveBtn = document.createElement("button");
    saveBtn.className = "btn-primary";
    saveBtn.textContent = "Save";

    var cancelEditBtn = document.createElement("button");
    cancelEditBtn.className = "btn-ghost";
    cancelEditBtn.textContent = "×";

    form.appendChild(dateInput);
    form.appendChild(timeInput);
    form.appendChild(saveBtn);
    form.appendChild(cancelEditBtn);
    actionsTd.appendChild(form);

    cancelEditBtn.addEventListener("click", function () {
      form.remove();
      actionsWrap.style.display = "";
    });

    saveBtn.addEventListener("click", function () {
      if (!dateInput.value || !timeInput.value) return;
      saveBtn.disabled = true;
      moveBooking(bk.id, dateInput.value, timeInput.value);
    });
  }

  function moveBooking(eventId, date, time) {
    setStatus("pending", "Moving booking…");
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "adminUpdate", key: getKey(), eventId: eventId, date: date, time: time })
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.ok) {
          if (json.error === "Unauthorized") { showLogin("Wrong admin key."); return; }
          setStatus("error", json.error || "Couldn't move booking.");
          return;
        }
        setStatus("ok", "Booking moved.");
        loadBookings();
      })
      .catch(function () {
        setStatus("error", "Couldn't reach the booking system.");
      });
  }

  function deleteBooking(eventId) {
    setStatus("pending", "Cancelling booking…");
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "adminDelete", key: getKey(), eventId: eventId })
    })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.ok) {
          if (json.error === "Unauthorized") { showLogin("Wrong admin key."); return; }
          setStatus("error", json.error || "Couldn't cancel booking.");
          return;
        }
        setStatus("ok", "Booking cancelled.");
        loadBookings();
      })
      .catch(function () {
        setStatus("error", "Couldn't reach the booking system.");
      });
  }

  loginBtn.addEventListener("click", function () {
    var val = keyInput.value.trim();
    if (!val) return;
    sessionStorage.setItem(STORAGE_KEY, val);
    keyInput.value = "";
    showApp();
  });

  keyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") loginBtn.click();
  });

  refreshBtn.addEventListener("click", loadBookings);
  lockBtn.addEventListener("click", function () { showLogin(""); });

  if (getKey()) {
    showApp();
  }
})();
</script>
</body>
</html>
